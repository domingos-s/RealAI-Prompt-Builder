<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RealPrompt • RealAI Prompt Builder v1.7</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&display=swap');
        :root {
            --ra-bg: #0b1220;
            --ra-surface: #141e31;
            --ra-text: #e7edf8;
            --ra-muted: #7d8ca8;
            --ra-accent: #f59e0b;
            --ra-border: #27334a;
            --ra-focus: rgba(245, 158, 11, 0.34);
            --ra-focus-brand: #fbbf24;
        }
        body { font-family: 'Inter', system-ui, sans-serif; }
        .heading { font-family: 'Space Grotesk', sans-serif; }
        .ra-page { background: var(--ra-bg); color: var(--ra-text); }
        .ra-surface { background: var(--ra-surface); border-color: var(--ra-border); }
        .ra-muted { color: var(--ra-muted); }
        .ra-accent { color: var(--ra-accent); }
        .ra-input {
            background: color-mix(in srgb, var(--ra-surface) 86%, black);
            border: 1px solid var(--ra-border);
            border-radius: 999px;
            color: var(--ra-text);
            transition: border-color .2s ease, box-shadow .2s ease;
        }
        textarea.ra-input { border-radius: 22px; }
        .ra-input::placeholder { color: color-mix(in srgb, var(--ra-muted) 82%, transparent); }
        .ra-input:focus-visible {
            outline: none;
            border-color: var(--ra-accent);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--ra-focus-brand) 38%, transparent);
        }
        .ra-input.file-input {
            border-radius: 999px;
            background: color-mix(in srgb, var(--ra-surface) 82%, black);
        }
        .ra-input.file-input::file-selector-button {
            border-radius: 999px;
            border: 0;
            background: color-mix(in srgb, var(--ra-surface) 74%, black);
            color: var(--ra-text);
            padding: 0.45rem 0.95rem;
            margin-right: 0.75rem;
        }
        .task-card {
            background: color-mix(in srgb, var(--ra-surface) 90%, black);
            border: 1px solid var(--ra-border);
            border-radius: 22px;
            color: var(--ra-text);
            transition: transform .2s cubic-bezier(0.4, 0, 0.2, 1), border-color .2s ease, box-shadow .2s ease, background-color .2s ease;
            box-shadow: 0 10px 20px -16px rgba(4, 8, 16, 0.7);
        }
        .task-card:hover {
            transform: translateY(-2px);
            border-color: color-mix(in srgb, var(--ra-accent) 45%, var(--ra-border));
            box-shadow: 0 12px 24px -16px rgba(4, 8, 16, 0.75);
        }
        .task-card:focus-visible,
        .ra-primary-btn:focus-visible,
        .ra-link-btn:focus-visible {
            outline: 2px solid var(--ra-focus-brand);
            outline-offset: 2px;
            box-shadow: 0 0 0 4px color-mix(in srgb, var(--ra-focus-brand) 34%, transparent);
        }
        .task-card.active {
            background: color-mix(in srgb, var(--ra-accent) 18%, var(--ra-surface));
            color: var(--ra-text) !important;
            border-color: var(--ra-accent) !important;
            box-shadow: 0 0 0 2px var(--ra-focus);
        }
        .ra-primary-btn {
            background: var(--ra-accent);
            color: #1a1202;
            border: 1px solid color-mix(in srgb, var(--ra-accent) 75%, black);
            border-radius: 999px;
            box-shadow: 0 8px 18px -14px rgba(245, 158, 11, 0.55);
            transition: transform .18s ease, filter .18s ease;
        }
        .ra-primary-btn:hover { filter: brightness(1.05); transform: translateY(-1px); }
        .ra-tertiary-btn {
            background: color-mix(in srgb, var(--ra-surface) 88%, black);
            border: 1px solid var(--ra-border);
            color: var(--ra-text);
            border-radius: 999px;
            transition: color .18s ease, background-color .18s ease, border-color .18s ease;
        }
        .ra-tertiary-btn:hover {
            color: var(--ra-text);
            background: color-mix(in srgb, var(--ra-surface) 70%, black);
            border-color: color-mix(in srgb, var(--ra-muted) 35%, var(--ra-border));
        }
        .ra-yaml-header {
            background: linear-gradient(90deg, color-mix(in srgb, var(--ra-accent) 10%, var(--ra-bg)), var(--ra-bg));
        }
        .ra-badge {
            border-radius: 999px;
            background: color-mix(in srgb, var(--ra-surface) 72%, black);
            border: 1px solid var(--ra-border);
            color: var(--ra-muted);
        }
        .ra-status {
            border-radius: 999px;
            border: 1px solid var(--ra-border);
            background: color-mix(in srgb, var(--ra-surface) 82%, black);
            color: var(--ra-muted);
        }
        .ra-status.success {
            border-color: color-mix(in srgb, var(--ra-accent) 26%, var(--ra-border));
            color: color-mix(in srgb, var(--ra-text) 92%, var(--ra-accent));
        }
        .ra-status.error {
            border-color: color-mix(in srgb, #fb7185 38%, var(--ra-border));
            color: #fecdd3;
        }
        pre { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--ra-accent) 72%, transparent); border-radius: 3px; }
        .ra-input-invalid {
            border-color: #f87171 !important;
            box-shadow: 0 0 0 2px rgba(248, 113, 113, 0.22);
        }
        .ra-field-error { color: #fca5a5; }
    </style>
</head>
<body class="ra-page min-h-screen overflow-hidden">
    <div class="flex flex-col lg:flex-row h-screen">
        <!-- Sidebar -->
        <div class="w-full lg:w-96 ra-surface border-b lg:border-r flex flex-col">
            <div class="p-6 border-b ra-surface flex items-center gap-3 ra-yaml-header">
                <div class="w-10 h-10 rounded-2xl flex items-center justify-center text-3xl font-bold heading shadow-inner" style="background: var(--ra-accent); color: #1a1202;">R</div>
                <div>
                    <div class="heading text-3xl font-semibold tracking-tighter">RealPrompt</div>
                    <div class="ra-accent text-xs font-medium tracking-[2px] uppercase">for RealAI • v1.7</div>
                </div>
            </div>
            <div class="p-6">
                <div class="relative">
                    <label for="search" class="sr-only">Search tasks</label>
                    <input id="search" type="text" placeholder="Search tasks..." class="w-full ra-input px-5 py-3.5 text-sm">
                    <i class="fas fa-search absolute right-5 top-4 ra-muted"></i>
                </div>
            </div>
            <ul id="tasks-list" class="flex-1 overflow-auto px-6 space-y-4 pb-8 custom-scroll" aria-label="Available prompt tasks"></ul>
            <div class="p-6 border-t ra-surface text-xs ra-muted">12 professional tasks • Smart Excel parsing</div>
        </div>

        <!-- Form Area -->
        <div class="flex-1 flex flex-col min-h-0">
            <div class="h-16 ra-surface border-b px-6 flex items-center justify-between flex-shrink-0">
                <div id="task-title" class="font-semibold text-lg">Select a task from the left</div>
                <div class="flex items-center gap-4">
                    <button onclick="resetForm()" class="ra-tertiary-btn flex items-center gap-2 px-5 py-2 text-sm"><i class="fas fa-rotate"></i> Clear</button>
                    <button onclick="copyYaml()" class="ra-primary-btn px-6 py-2 font-medium flex items-center gap-2"><i class="fas fa-copy"></i> Copy YAML Prompt</button>
                </div>
            </div>
            <div id="form-area" class="flex-1 overflow-auto p-6 lg:p-10 ra-page">
                <div id="form-content" class="max-w-3xl mx-auto"></div>
            </div>
        </div>

        <!-- YAML Preview -->
        <div class="w-full lg:w-5/12 ra-surface border-t lg:border-l flex flex-col min-h-0">
            <div class="px-6 py-5 border-b ra-surface flex items-center justify-between ra-yaml-header flex-shrink-0">
                <div class="flex items-center gap-3 ra-accent"><i class="fas fa-file-code text-xl"></i><span class="font-medium tracking-tight">RealAI Prompt (YAML)</span></div>
                <button onclick="downloadYaml()" class="ra-tertiary-btn flex items-center gap-2 text-sm px-4 py-1.5"><i class="fas fa-download"></i> Download .yaml</button>
            </div>
            <pre id="yaml-preview" class="flex-1 p-6 overflow-auto text-[13px] leading-relaxed font-mono whitespace-pre-wrap border-t custom-scroll" style="color: color-mix(in srgb, var(--ra-accent) 28%, var(--ra-text)); background: var(--ra-bg); border-color: var(--ra-border);"></pre>
        </div>
    </div>

    <script>
        const tasks = [
            {
                id: "comprehensive_underwriting",
                category: "acquisitions",
                name: "Comprehensive Property Underwriting & Valuation",
                description: "Full institutional-grade underwriting: income/expense normalization, comps analysis, 10-year pro forma, debt structuring, sensitivity, and go/no-go recommendation.",
                fields: [
                    {id: "address", label: "Full property address (street, city, state, ZIP)", type: "text", placeholder: "1425 Oak Grove Lane, Austin, TX 78704", required: true},
                    {id: "offer_price", label: "Proposed offer / purchase price ($)", type: "number", placeholder: "42500000"},
                    {id: "total_units", label: "Total number of units", type: "number", placeholder: "248"},
                    {id: "unit_mix", label: "Detailed unit mix with average square footage", type: "textarea", placeholder: "80×Studio (550 sf)\n120×1BR (750 sf)\n48×2BR (1,050 sf)"},
                    {id: "year_built", label: "Year built or last major renovation", type: "number", placeholder: "2019"},
                    {id: "rentable_sf", label: "Total rentable square feet", type: "number", placeholder: "185000"},
                    {id: "current_occupancy", label: "Current physical occupancy (%)", type: "number", placeholder: "93"},
                    {id: "rent_roll_file", label: "Upload Rent Roll Excel/CSV", type: "file", accept: ".xlsx,.csv"},
                    {id: "rent_roll_paste", label: "OR paste key rent roll summary (loss-to-lease, concessions, etc.)", type: "textarea"},
                    {id: "t12_file", label: "Upload T12 Financials Excel", type: "file", accept: ".xlsx"},
                    {id: "t12_paste", label: "OR paste key T12 totals (income, expenses, NOI)", type: "textarea"},
                    {id: "market_rents", label: "Current market rents by unit type (from comps)", type: "textarea", placeholder: "Studio $1,650\n1BR $2,050\n2BR $2,650"},
                    {id: "sales_comps", label: "Recent sales comps (address, price/unit, cap rate, date)", type: "textarea"},
                    {id: "financing_assumptions", label: "Financing assumptions (LTV, interest rate, term, IO period)", type: "text", placeholder: "65% LTV, 5.25%, 10 yr, 2 yr IO"},
                    {id: "hold_period", label: "Intended holding period (years)", type: "number", placeholder: "7"},
                    {id: "exit_cap_rate", label: "Assumed exit cap rate range (%)", type: "text", placeholder: "5.25 - 5.75"},
                    {id: "sensitivity_scenarios", label: "Scenarios to stress-test", type: "textarea", placeholder: "+150 bps rates\n-10% rent growth\n+200 bps exit cap"},
                    {id: "investment_thesis", label: "Your high-level investment thesis", type: "textarea"}
                ]
            },
            {
                id: "rent_roll_analysis",
                category: "acquisitions",
                name: "Rent Roll & Income Analysis",
                description: "Deep income analysis: loss-to-lease, revenue upside, lease rollover, concessions, and stabilization forecast.",
                fields: [
                    {id: "address", label: "Full property address", type: "text", required: true},
                    {id: "rent_roll_file", label: "Upload full Rent Roll Excel/CSV", type: "file", accept: ".xlsx,.csv"},
                    {id: "rent_roll_paste", label: "OR paste rent roll summary", type: "textarea"},
                    {id: "market_rents", label: "Market rents by unit type", type: "textarea"},
                    {id: "loss_to_lease_pct", label: "Estimated loss-to-lease (%)", type: "number"},
                    {id: "concessions_monthly", label: "Current monthly concessions", type: "number"},
                    {id: "other_income_monthly", label: "Monthly other income (parking, fees, laundry, etc.)", type: "number"},
                    {id: "lease_expirations", label: "Lease expiration schedule summary", type: "textarea"},
                    {id: "renewal_probability", label: "Expected renewal rate (%)", type: "number", placeholder: "65"},
                    {id: "bad_debt_pct", label: "Historical bad debt / collection loss (%)", type: "number"}
                ]
            },
            {
                id: "expense_benchmarking",
                category: "acquisitions",
                name: "Operating Expense Benchmarking",
                description: "Line-by-line expense benchmarking vs. market and identification of savings opportunities.",
                fields: [
                    {id: "address", label: "Full property address", type: "text", required: true},
                    {id: "t12_file", label: "Upload T12 Financials Excel", type: "file", accept: ".xlsx"},
                    {id: "t12_paste", label: "OR paste current expense breakdown", type: "textarea"},
                    {id: "property_taxes", label: "Current property taxes (annual)", type: "number"},
                    {id: "insurance", label: "Current insurance (annual)", type: "number"},
                    {id: "utilities", label: "Current utilities (annual)", type: "number"},
                    {id: "payroll", label: "Current payroll & benefits (annual)", type: "number"},
                    {id: "repairs_maintenance", label: "Current repairs & maintenance (annual)", type: "number"},
                    {id: "management_fee_pct", label: "Management fee assumption (%)", type: "number", placeholder: "3.5"},
                    {id: "reserves_per_unit", label: "Replacement reserves per unit per year", type: "number", placeholder: "350"}
                ]
            },
            {
                id: "sales_comps",
                category: "acquisitions",
                name: "Sales Comps & Pricing Analysis",
                description: "Identify and analyze the most relevant recent sales comparables with adjustments.",
                fields: [
                    {id: "address", label: "Subject property address", type: "text", required: true},
                    {id: "search_radius_miles", label: "Search radius (miles)", type: "number", placeholder: "1.5"},
                    {id: "lookback_months", label: "Lookback period for sales (months)", type: "number", placeholder: "24"},
                    {id: "target_cap_rate", label: "Target going-in cap rate range (%)", type: "text", placeholder: "5.25 - 5.75"},
                    {id: "sales_comps_paste", label: "Paste known sales comps (address, price, units, date, cap rate)", type: "textarea"},
                    {id: "price_per_unit_target", label: "Target price per unit", type: "number"}
                ]
            },
            {
                id: "rental_comps",
                category: "acquisitions",
                name: "Rental Comps Analysis",
                description: "Detailed rental comparable analysis and rent growth forecast.",
                fields: [
                    {id: "address", label: "Subject property address", type: "text", required: true},
                    {id: "comp_radius_miles", label: "Rental comps search radius (miles)", type: "number", placeholder: "1"},
                    {id: "growth_assumption", label: "Expected annual rent growth next 3 years", type: "text", placeholder: "4.5% Yr1, 3.5% Yr2-3"},
                    {id: "rental_comps_paste", label: "Paste key rental comps (address, rent/sf, occupancy, concessions)", type: "textarea"}
                ]
            },
            {
                id: "sensitivity_analysis",
                category: "acquisitions",
                name: "Sensitivity & Scenario Analysis",
                description: "Stress-test returns under multiple economic and market scenarios.",
                fields: [
                    {id: "address", label: "Property address", type: "text", required: true},
                    {id: "base_irr", label: "Target base-case IRR (%)", type: "number", placeholder: "15"},
                    {id: "scenarios", label: "Scenarios to model", type: "textarea", placeholder: "+150 bps interest rates\n-10% rent growth\n+200 bps exit cap\nRecession case"},
                    {id: "hold_period", label: "Holding period for analysis (years)", type: "number", placeholder: "7"}
                ]
            },
            {
                id: "ic_memo",
                category: "acquisitions",
                name: "Investment Committee Memo Draft",
                description: "Complete professional IC memo ready for presentation.",
                fields: [
                    {id: "address", label: "Property address", type: "text", required: true},
                    {id: "investment_thesis", label: "Your investment thesis (2-3 sentences)", type: "textarea"},
                    {id: "key_strengths", label: "Key strengths / upside drivers", type: "textarea"},
                    {id: "key_risks", label: "Key risks", type: "textarea"}
                ]
            },
            {
                id: "dd_review",
                category: "acquisitions",
                name: "Due Diligence Review & Risk Summary",
                description: "Summarize due diligence findings, red flags, and mitigation strategies.",
                fields: [
                    {id: "address", label: "Property address", type: "text", required: true},
                    {id: "pca_file", label: "Upload PCA / Engineering Report (PDF summary)", type: "file", accept: ".pdf"},
                    {id: "phase1_file", label: "Upload Phase I ESA (PDF summary)", type: "file", accept: ".pdf"},
                    {id: "dd_findings", label: "Key due diligence findings or concerns", type: "textarea", placeholder: "Roof remaining life 8 years, environmental clean, title exception on easement"},
                    {id: "rent_roll_reconciliation", label: "Rent roll vs T12 vs bank statement reconciliation notes", type: "textarea"}
                ]
            },
            {
                id: "ground_up_proforma",
                category: "development",
                name: "Ground-Up Development Pro Forma & Feasibility",
                description: "Full development feasibility study, sources & uses, pro forma, and yield-on-cost.",
                fields: [
                    {id: "site_address", label: "Site address", type: "text", required: true},
                    {id: "land_cost", label: "Land acquisition cost ($)", type: "number"},
                    {id: "planned_units", label: "Planned total units", type: "number", required: true},
                    {id: "total_hard_cost", label: "Total hard construction cost ($)", type: "number"},
                    {id: "total_soft_cost", label: "Total soft costs & fees ($)", type: "number"},
                    {id: "entitlements_status", label: "Current entitlement / zoning status", type: "text", placeholder: "MF-3 zoned, approvals expected Q3 2027"},
                    {id: "construction_start", label: "Anticipated construction start date", type: "text"},
                    {id: "absorption_rate", label: "Expected monthly absorption (units/month)", type: "text", placeholder: "18"},
                    {id: "stabilized_noi", label: "Projected stabilized NOI (annual)", type: "number"},
                    {id: "sources_uses_paste", label: "Paste sources & uses summary if available", type: "textarea"}
                ]
            },
            {
                id: "value_add",
                category: "development",
                name: "Value-Add Renovation Underwriting",
                description: "Scope, budget, timeline, and returns for renovation / value-add projects.",
                fields: [
                    {id: "address", label: "Property address", type: "text", required: true},
                    {id: "renovation_scope", label: "Renovation scope summary", type: "textarea", placeholder: "Full interior refresh + common area upgrade + new amenity package"},
                    {id: "renovation_budget", label: "Total renovation budget ($)", type: "number"},
                    {id: "rent_bump_per_unit", label: "Expected average rent increase per unit ($)", type: "number"},
                    {id: "renovation_timeline_months", label: "Renovation timeline (months)", type: "number", placeholder: "9"},
                    {id: "unit_turnover_rate", label: "Expected unit turnover rate during reno (%)", type: "number"}
                ]
            },
            {
                id: "site_feasibility",
                category: "development",
                name: "Site Acquisition Feasibility & Entitlements",
                description: "Site feasibility, zoning analysis, entitlement risk, and permitting timeline.",
                fields: [
                    {id: "site_address", label: "Site address", type: "text", required: true},
                    {id: "land_size_acres", label: "Land size (acres or sq ft)", type: "text", placeholder: "8.4 acres"},
                    {id: "current_zoning", label: "Current zoning and allowed density", type: "text", placeholder: "MF-4, 45 units/acre"},
                    {id: "entitlement_risks", label: "Known entitlement or permitting risks", type: "textarea"},
                    {id: "survey_file", label: "Upload survey / ALTA (if available)", type: "file", accept: ".pdf"},
                    {id: "geotech_file", label: "Upload geotechnical report summary", type: "file", accept: ".pdf"}
                ]
            },
            {
                id: "yield_on_cost",
                category: "development",
                name: "Yield-on-Cost & Development Return Analysis",
                description: "Detailed yield-on-cost, IRR, equity multiple, and development return metrics.",
                fields: [
                    {id: "site_address", label: "Site address", type: "text", required: true},
                    {id: "total_all_in_cost", label: "Total all-in development cost ($)", type: "number"},
                    {id: "stabilized_noi", label: "Projected stabilized annual NOI", type: "number"},
                    {id: "target_yield_range", label: "Target yield-on-cost range (%)", type: "text", placeholder: "7.25 - 7.75"},
                    {id: "equity_required", label: "Equity required ($)", type: "number"},
                    {id: "projected_irr", label: "Target project IRR (%)", type: "number", placeholder: "18"}
                ]
            }
        ];

        let currentTask = null;
        let formData = {};
        let activeCard = null;

        function renderTasks(filtered) {
            const container = document.getElementById('tasks-list');
            container.innerHTML = '';
            filtered.forEach(task => {
                const listItem = document.createElement('li');
                listItem.className = 'list-none';

                const el = document.createElement('button');
                el.type = 'button';
                el.className = `task-card p-6 cursor-pointer text-left w-full`;
                el.dataset.id = task.id;
                el.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="inline-block px-3 py-1 text-[10px] font-medium tracking-widest ra-badge">${task.category}</span>
                            <div class="mt-3 font-semibold leading-tight text-lg">${task.name}</div>
                            <div class="ra-muted text-sm mt-2 line-clamp-2">${task.description}</div>
                        </div>
                    </div>
                `;
                el.addEventListener('click', () => loadTask(task, el));
                listItem.appendChild(el);
                container.appendChild(listItem);
            });
        }

        function loadTask(task, cardElement) {
            if (activeCard) activeCard.classList.remove('active');
            activeCard = cardElement;
            activeCard.classList.add('active');

            currentTask = task;
            formData = {};

            document.getElementById('task-title').textContent = task.name;

            let html = `<div class="space-y-10">`;
            task.fields.forEach(field => {
                html += `
                    <div>
                        <label for="field-${field.id}" class="block text-sm font-medium mb-2" style="color: var(--ra-text);">${field.label}${field.required ? ' <span class="text-red-400">*</span>' : ''}</label>
                `;
                if (field.type === "file") {
                    html += `
                        <input id="field-${field.id}" type="file" accept="${field.accept}" 
                               class="w-full ra-input file-input px-6 py-4 text-sm ra-muted">
                        <div id="file-status-${field.id}" class="ra-status text-xs mt-2 px-4 py-2 hidden"></div>
                    `;
                } else if (field.type === "textarea") {
                    html += `<textarea id="field-${field.id}" rows="3" class="w-full ra-input resize-y min-h-[100px] px-6 py-4" placeholder="${field.placeholder || ''}"></textarea>`;
                } else {
                    html += `<input id="field-${field.id}" type="${field.type}" class="w-full ra-input px-6 py-4" placeholder="${field.placeholder || ''}">`;
                }
                html += `<div id="field-error-${field.id}" class="ra-field-error text-xs mt-1.5"></div>`;
                html += `</div>`;
            });
            html += `</div>`;
            document.getElementById('form-content').innerHTML = html;

            task.fields.forEach(field => {
                const el = document.getElementById(`field-${field.id}`);
                if (!el) return;
                if (field.type === "file") {
                    el.addEventListener('change', async (e) => {
                        const file = e.target.files[0];
                        if (!file) return;
                        const statusEl = document.getElementById(`file-status-${field.id}`);
                        statusEl.className = 'ra-status text-xs mt-2 px-4 py-2';
                        statusEl.textContent = `✓ ${file.name} selected — parsing...`;
                        formData[field.id] = file.name;

                        try {
                            if (file.name.endsWith('.xlsx') || file.name.endsWith('.csv')) {
                                const summary = await parseExcelOrCsv(file, field.id);
                                formData[`${field.id}_summary`] = summary;
                                if (summary.type === "t12_expense_summary") {
                                    let statusText = `✓ Parsed ${summary.rows} rows • ${summary.detectedColumns} columns detected`;
                                    if (summary.expenses) {
                                        const numCats = Object.keys(summary.expenses).length;
                                        const totalExpenses = Object.values(summary.expenses).reduce((a, b) => a + b, 0);
                                        statusText += ` • ${numCats} categories • Total ~$${Math.round(totalExpenses / 1000)}K`;
                                    }
                                    statusEl.textContent = statusText;
                                } else {
                                    statusEl.textContent = `✓ Rent roll parsed: ${summary.units || '?'} units • avg rent $${summary.avgRent || '?'}`;
                                }
                            } else {
                                statusEl.textContent = `✓ ${file.name} selected (non-Excel file — summary not parsed)`;
                            }
                            statusEl.classList.add('success');
                            statusEl.classList.remove('error');
                            updateYaml();
                        } catch (error) {
                            console.error('Parsing error:', error);
                            statusEl.textContent = `❌ Parsing failed: ${error.message} — Try again or check file format`;
                            statusEl.classList.add('error');
                            statusEl.classList.remove('success');
                        }
                    });
                } else {
                    el.addEventListener('input', () => {
                        formData[field.id] = el.value.trim();
                        clearFieldError(field.id);
                        validateCurrentTask(false);
                        updateYaml();
                    });
                }
            });

            updateYaml();
        }

        function parseCurrencyNumber(value) {
            if (typeof value === 'number') return value;
            if (typeof value !== 'string') return NaN;
            const cleaned = value
                .trim()
                .replace(/[$,]/g, '')
                .replace(/\(([^)]+)\)/, '-$1');
            return parseFloat(cleaned);
        }

        function findBestHeaderRow(rows, scanLimit = 6) {
            const monthTokens = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
            let bestIndex = 0;
            let bestScore = -1;

            for (let i = 0; i < Math.min(rows.length, scanLimit); i++) {
                const row = rows[i] || [];
                const normalized = row.map(cell => (typeof cell === 'string' ? cell.toLowerCase() : ''));
                const monthHits = normalized.filter(cell => monthTokens.some(m => cell.includes(m))).length;
                const totalHits = normalized.filter(cell => cell.includes('total') || cell.includes('ytd') || cell.includes('annual')).length;
                const score = monthHits * 2 + totalHits;
                if (score > bestScore) {
                    bestScore = score;
                    bestIndex = i;
                }
            }

            return bestIndex;
        }

        function inferT12Amount(row, totalIndex = -1) {
            if (totalIndex >= 0) {
                const explicitTotal = parseCurrencyNumber(row[totalIndex]);
                if (!isNaN(explicitTotal)) return explicitTotal;
            }

            const numericValues = row
                .slice(1)
                .map(parseCurrencyNumber)
                .filter(value => !isNaN(value));

            if (numericValues.length === 0) return 0;

            const maybeTotal = numericValues[numericValues.length - 1];
            const sumWithoutLast = numericValues.slice(0, -1).reduce((sum, value) => sum + value, 0);
            const relativeDiff = sumWithoutLast !== 0 ? Math.abs(maybeTotal - sumWithoutLast) / Math.abs(sumWithoutLast) : Infinity;

            // Common T-12 fallback: Jan-Dec plus an unlabeled annual total value.
            if (numericValues.length >= 13 && relativeDiff < 0.01) {
                return maybeTotal;
            }

            return numericValues.reduce((sum, value) => sum + value, 0);
        }

        async function parseExcelOrCsv(file, fieldId = '') {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        let workbook;
                        if (file.name.endsWith('.csv')) {
                            workbook = XLSX.read(e.target.result, {type: 'string'});
                        } else {
                            workbook = XLSX.read(e.target.result, {type: 'array'});
                        }
                        if (!workbook.SheetNames || workbook.SheetNames.length === 0) {
                            throw new Error('No worksheet found');
                        }
                        const sheet = workbook.Sheets[workbook.SheetNames[0]];
                        if (!sheet) {
                            throw new Error('Unable to read first worksheet');
                        }
                        const json = XLSX.utils.sheet_to_json(sheet, {header: 1, blankrows: false, defval: null}); // raw array, no blanks
                        if (!json.length) {
                            throw new Error('Worksheet is empty (0 rows parsed)');
                        }

                        const detectedColumns = json.reduce((max, row) => Math.max(max, (row || []).length), 0);
                        if (detectedColumns === 0) {
                            throw new Error('No columns detected in worksheet');
                        }

                        const isT12 = fieldId.includes('t12') || fieldId.includes('expense');

                        if (isT12) {
                            let expenses = {};
                            let rows = json.length;
                            const headerRowIndex = findBestHeaderRow(json);
                            let header = json[headerRowIndex] || [];
                            let totalIndex = header.findIndex(col => col && typeof col === 'string' && (col.toLowerCase().includes('total') || col.toLowerCase().includes('ytd') || col.toLowerCase().includes('annual')));
                            let hasTotal = totalIndex >= 0;

                            for (let i = headerRowIndex + 1; i < json.length; i++) {
                                let row = json[i];
                                let category = row[0] && typeof row[0] === 'string' ? row[0].trim().toLowerCase() : null;
                                if (!category || category === '' || category.includes('total')) continue; // skip empty or totals

                                let amount = inferT12Amount(row, hasTotal ? totalIndex : -1);
                                if (!isNaN(amount) && amount !== 0) {
                                    expenses[category] = amount;
                                }
                            }
                            resolve({
                                type: "t12_expense_summary",
                                rows: rows,
                                detectedColumns: detectedColumns,
                                note: "Expense categories / financial lines detected (typical T-12 format)",
                                expenses: expenses,
                                rawRows: rows
                            });
                        } else {
                            // original rent-roll logic
                            let units = json.length - 1; // subtract header
                            let totalRent = 0, count = 0;
                            for (let i = 1; i < json.length; i++) {
                                const row = json[i];
                                const rentIndex = row.findIndex(cell => cell && typeof cell === 'string' && cell.toLowerCase().includes('rent'));
                                const rent = rentIndex >= 0 ? parseFloat(row[rentIndex + 1] || row[rentIndex] || 0) : 0;
                                if (rent > 0) { totalRent += rent; count++; }
                            }
                            resolve({
                                type: "rent_roll_summary",
                                rows: json.length,
                                detectedColumns: detectedColumns,
                                units: units,
                                avgRent: count ? Math.round(totalRent / count) : null,
                                rawRows: json.length
                            });
                        }
                    } catch (error) {
                        reject(error);
                    }
                };
                reader.onerror = (error) => reject(error);
                if (file.name.endsWith('.csv')) reader.readAsText(file);
                else reader.readAsArrayBuffer(file);
            });
        }

        function getPersonaGuidance() {
            if (!currentTask) return "";
            const isDev = currentTask.category === "development";
            return `You are a senior multifamily analyst at a leading institutional ${isDev ? 'development' : 'acquisitions'} firm. You deliver rigorous, data-driven, institutional-grade analysis with conservative assumptions, clear market context, detailed comps, financial modeling best practices, and actionable go/no-go recommendations.`;
        }

        function updateYaml() {
            if (!currentTask) return;
            
            const yamlObj = {
                version: "1.7",
                generated_at: new Date().toISOString(),
                task: currentTask.id,
                realai_guidance: getPersonaGuidance(),
                property_profile: {
                    address: formData.address || formData.site_address || "Not provided",
                    ...formData
                },
                analysis_objectives: [
                    "Produce institutional-quality analysis",
                    "Include relevant market data, comps, and forecasts",
                    "Show all key metrics and assumptions",
                    "Provide clear recommendation with supporting rationale"
                ],
                constraints_and_assumptions: {
                    conservative_assumptions: true,
                    hold_period_years: parseInt(formData.hold_period) || 7,
                    target_irr: "≥14%",
                    vacancy_stabilized: "5-6%"
                },
                required_output_structure: [
                    "Executive Summary & Recommendation",
                    "Property Overview",
                    "Market & Submarket Analysis",
                    "Comps Tables (rental & sales where applicable)",
                    "Financial Pro Forma & Key Metrics",
                    "Sensitivity / Scenario Analysis",
                    "Risks & Mitigants",
                    "Actionable Next Steps"
                ],
                additional_context: "Prompt generated via RealPrompt Builder v1.7. All uploaded files parsed client-side. Use any attached file summaries or pasted data directly."
            };

            try {
                const yamlStr = jsyaml.dump(yamlObj, { indent: 2, lineWidth: 120 });
                document.getElementById('yaml-preview').textContent = yamlStr;
            } catch (e) {
                document.getElementById('yaml-preview').textContent = "# YAML generation error";
            }
        }

        function copyYaml() {
            const text = document.getElementById('yaml-preview').textContent;
            if (!text || text.includes("# Select")) {
                alert("Please select a task and fill in some details first");
                return;
            }
            if (!validateCurrentTask(true)) {
                alert('Please complete all required fields before copying YAML.');
                return;
            }
            navigator.clipboard.writeText(text).then(() => {
                const btn = event.currentTarget;
                const orig = btn.innerHTML;
                btn.innerHTML = `<i class="fas fa-check"></i> Copied!`;
                setTimeout(() => btn.innerHTML = orig, 1800);
            });
        }

        function downloadYaml() {
            const text = document.getElementById('yaml-preview').textContent;
            if (!text || text.includes("# Select")) return;
            if (!validateCurrentTask(true)) {
                alert('Please complete all required fields before downloading YAML.');
                return;
            }
            const blob = new Blob([text], { type: 'text/yaml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${currentTask ? currentTask.id : 'realai-prompt'}.yaml`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function resetForm() {
            if (!currentTask) return;
            formData = {};
            currentTask.fields.forEach(f => {
                const el = document.getElementById(`field-${f.id}`);
                if (el) {
                    if (f.type === "file") el.value = '';
                    else el.value = '';
                }
                clearFieldError(f.id);
            });
            validateCurrentTask(false);
            updateYaml();
        }

        function clearFieldError(fieldId) {
            const fieldEl = document.getElementById(`field-${fieldId}`);
            const errorEl = document.getElementById(`field-error-${fieldId}`);
            if (fieldEl) fieldEl.classList.remove('ra-input-invalid');
            if (errorEl) errorEl.textContent = '';
        }

        function validateCurrentTask(showErrors = true) {
            if (!currentTask) return false;

            const missingRequired = currentTask.fields.filter(field => {
                if (!field.required) return false;
                const value = formData[field.id];
                return value === undefined || value === null || String(value).trim() === '';
            });

            if (showErrors) {
                currentTask.fields.forEach(field => clearFieldError(field.id));
                missingRequired.forEach(field => {
                    const fieldEl = document.getElementById(`field-${field.id}`);
                    const errorEl = document.getElementById(`field-error-${field.id}`);
                    if (fieldEl) fieldEl.classList.add('ra-input-invalid');
                    if (errorEl) errorEl.textContent = 'This field is required.';
                });
            }

            return missingRequired.length === 0;
        }

        document.getElementById('search').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase().trim();
            const filtered = term === '' ? tasks : tasks.filter(t => 
                t.name.toLowerCase().includes(term) || t.description.toLowerCase().includes(term)
            );
            renderTasks(filtered);
        });

        // Initial render
        renderTasks(tasks);
        document.getElementById('yaml-preview').textContent = '# Select a task to generate your institutional-grade RealAI prompt';

        console.log('%c✅ RealPrompt v1.7 – Fixed null/undefined header checks • Safer parsing • Ready', 'color:#10b981; font-weight:600');
    </script>
